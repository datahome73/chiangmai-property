version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmproperty
      POSTGRES_PASSWORD: cmproperty_secret
      POSTGRES_DB: cmproperty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmproperty"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cmproperty:cmproperty_secret@db:5432/cmproperty
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-to-a-random-secret-in-production
      CORS_ORIGINS: https://cmproperty.com
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-react/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"

  crawler:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cmproperty:cmproperty_secret@db:5432/cmproperty
      SCRAPY_SETTINGS_MODULE: crawlers.settings
    volumes:
      - ./backend/crawlers:/app/crawlers
    command: sleep infinity

volumes:
  postgres_data:
