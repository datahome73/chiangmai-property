[nixpacks]
# Railway uses Nixpacks to auto-detect the project.
# This config overrides defaults for our mono-repo.

[phases.setup]
nixPkgs = ["python311", "nodejs_20", "uvicorn"]

[phases.install]
cmds = [
  "cd frontend && npm install",
  "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
